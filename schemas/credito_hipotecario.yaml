caso_uso: credito_hipotecario
version: "1.0"
descripcion: >
  Esquema para auditoría documental de contrato/escritura de préstamo hipotecario (PDF).
  Define campos básicos extraíbles y reglas de coherencia para revisión por analista.

documentos:
  - tipo: CONTRATO_HIPOTECA
    descripcion: "Contrato/escritura de préstamo hipotecario"
    campos:
      - nombre: id_documento
        etiqueta: "Identificador interno del documento"
        tipo_dato: string
        requerido: false
      - nombre: nombre_cliente
        etiqueta: "Nombre y apellidos del cliente"
        tipo_dato: string
        requerido: true
      - nombre: dni_cliente
        etiqueta: "Documento de identidad (DNI/NIE)"
        tipo_dato: string
        requerido: true
        patron: "^[XYZ0-9][0-9]{7}[A-Z]$"
      - nombre: monto_prestamo_eur
        etiqueta: "Importe del préstamo (EUR)"
        tipo_dato: float
        requerido: true
        validacion:
          rango_min: 0.0
      - nombre: tasa_interes
        etiqueta: "Tipo de interés anual (%)"
        tipo_dato: float
        requerido: true
        validacion:
          rango_min: 0.0
      - nombre: fecha_emision
        etiqueta: "Fecha de emisión / firma"
        tipo_dato: date
        requerido: true

reglas_decision:
  - id: H01
    descripcion: "Importe de préstamo positivo"
    expresion: "monto_prestamo_eur > 0"
    severidad: critica
    normativa: "Coherencia documental (control interno)"
  - id: H02
    descripcion: "Tipo de interés en rango razonable (0-20%)"
    expresion: "tasa_interes >= 0 and tasa_interes <= 20"
    severidad: advertencia
    normativa: "Coherencia documental (control interno)"
  - id: H03
    descripcion: "Documento con identificador presente"
    expresion: "id_documento != null and id_documento != ''"
    severidad: advertencia
    normativa: "Trazabilidad (control interno)"

informe:
  formato: ["json", "markdown"]
  incluir_score_confianza: true
  nivel_detalle: resumen
  idioma: es
