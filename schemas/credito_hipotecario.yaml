caso_uso: credito_hipotecario
version: "1.0"
descripcion: >
  Esquema para auditoría documental de contrato/escritura de préstamo hipotecario (PDF).
  Define campos básicos extraíbles y reglas de coherencia para revisión por analista.

documentos:
  - tipo: CONTRATO_HIPOTECA
    descripcion: "Contrato/escritura de préstamo hipotecario"
    campos:
      - nombre: id_documento
        etiqueta: "Identificador interno del documento"
        tipo_dato: string
        requerido: false
      - nombre: nombre_cliente
        etiqueta: "Nombre y apellidos del cliente"
        tipo_dato: string
        requerido: true
      - nombre: dni_cliente
        etiqueta: "Documento de identidad (DNI/NIE)"
        tipo_dato: string
        requerido: true
        patron: "^[XYZ0-9][0-9]{7}[A-Z]$"
      - nombre: monto_prestamo_eur
        etiqueta: "Importe del préstamo (EUR)"
        tipo_dato: float
        requerido: true
        validacion:
          rango_min: 0.0
      - nombre: tasa_interes
        etiqueta: "Tipo de interés anual (%)"
        tipo_dato: float
        requerido: true
        validacion:
          rango_min: 0.0
      - nombre: tae
        etiqueta: "Tasa anual equivalente (TAE)"
        tipo_dato: float
        requerido: false
        validacion:
          rango_min: 0.0
      - nombre: plazo_meses
        etiqueta: "Plazo total del préstamo en meses"
        tipo_dato: int
        requerido: false
        validacion:
          rango_min: 1
      - nombre: cuota_mensual_eur
        etiqueta: "Cuota mensual estimada o pactada"
        tipo_dato: float
        requerido: false
        validacion:
          rango_min: 0.0
      - nombre: ingresos_mensuales_eur
        etiqueta: "Ingresos mensuales declarados"
        tipo_dato: float
        requerido: false
        validacion:
          rango_min: 0.0
      - nombre: gastos_mensuales_eur
        etiqueta: "Gastos mensuales recurrentes"
        tipo_dato: float
        requerido: false
        validacion:
          rango_min: 0.0
      - nombre: ratio_endeudamiento
        etiqueta: "Ratio de endeudamiento estimado"
        tipo_dato: float
        requerido: false
        validacion:
          rango_min: 0.0
          rango_max: 1.0
      - nombre: comision_apertura_eur
        etiqueta: "Comisión de apertura"
        tipo_dato: float
        requerido: false
        validacion:
          rango_min: 0.0
      - nombre: fein_entregada
        etiqueta: "Entrega de FEIN al prestatario"
        tipo_dato: bool
        requerido: false
      - nombre: fiae_entregada
        etiqueta: "Entrega de FIAE al prestatario"
        tipo_dato: bool
        requerido: false
      - nombre: sistema_amortizacion
        etiqueta: "Sistema de amortización"
        tipo_dato: string
        requerido: false
      - nombre: fecha_emision
        etiqueta: "Fecha de emisión / firma"
        tipo_dato: date
        requerido: true

reglas_decision:
  - id: H01
    descripcion: "Importe de préstamo positivo"
    expresion: "monto_prestamo_eur > 0"
    severidad: critica
    normativa: "Coherencia documental (control interno)"
  - id: H02
    descripcion: "Tipo de interés en rango razonable (0-20%)"
    expresion: "tasa_interes >= 0 and tasa_interes <= 20"
    severidad: advertencia
    normativa: "Coherencia documental (control interno)"
  - id: H03
    descripcion: "Documento con identificador presente"
    expresion: "id_documento != null and id_documento != ''"
    severidad: advertencia
    normativa: "Trazabilidad (control interno)"
  - id: H04
    descripcion: "TAE en rango razonable cuando está informada"
    expresion: "tae == null or (tae >= tasa_interes and tae <= 25)"
    severidad: advertencia
    normativa: "Ley 5/2019 (LCCI) — transparencia de coste"
  - id: H05
    descripcion: "Plazo positivo cuando está informado"
    expresion: "plazo_meses == null or plazo_meses > 0"
    severidad: advertencia
    normativa: "Ley 5/2019 (LCCI) — condiciones económicas"
  - id: H06
    descripcion: "Esfuerzo financiero razonable cuando hay ingresos y cuota"
    expresion: "ingresos_mensuales_eur == null or cuota_mensual_eur == null or (ingresos_mensuales_eur > 0 and (cuota_mensual_eur / ingresos_mensuales_eur) <= 0.35)"
    severidad: advertencia
    normativa: "Circular 4/2017 BdE — capacidad de pago"
  - id: H07
    descripcion: "Ratio de endeudamiento razonable cuando está informado"
    expresion: "ratio_endeudamiento == null or ratio_endeudamiento <= 0.4"
    severidad: advertencia
    normativa: "Circular 4/2017 BdE — endeudamiento prudente"
  - id: H08
    descripcion: "FEIN y FIAE, si se informan, deben constar como entregadas"
    expresion: "(fein_entregada == null or fein_entregada == true) and (fiae_entregada == null or fiae_entregada == true)"
    severidad: info
    normativa: "Ley 5/2019 (LCCI) — informacion precontractual"

informe:
  formato: ["json", "markdown"]
  incluir_evidencias: true
  incluir_score_confianza: true
  nivel_detalle: resumen
  idioma: es
