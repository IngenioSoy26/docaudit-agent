caso_uso: auditoria_fiscal
version: "1.0"
descripcion: >
  Decreto 1619/2012, que aprueba el Reglamento por el que se regulan las obligaciones de facturación en España (AEAT).
documentos:
  tipo: FACTURA_PROVEEDOR
  campos:
    - nombre: razon_social_emisor
      etiqueta: "Denominacion social del Expedidor"
      tipo_dato: string
      requerido: true
    - nombre: nif_emisor
      etiqueta: "Numero de Identificacion Fiscal (NIF)"
      tipo_dato: string
      patron: "^[A-HJNP-SUW][0-9]{7}[0-9A-J]$" # Patron oficial de NIF de empresas en España
      requerido: true
    - nombre: num_factura
      etiqueta: "Numero de factura y, en su caso, serie"
      tipo_dato: string
      requerido: true
    - nombre: direccion_expedidor
      etiqueta: "Dirección del expedidor"
      tipo_dato: string
      requerido: true
    - nombre: telefono_expedidor
      etiqueta: "Telefono del expedidor"
      tipo_dato: string
      requerido: true
    - nombre: correo_expedidor
      etiqueta: "Correo del expedidor"
      tipo_dato: string
      requerido: true
    - nombre: fecha_expedicion
      etiqueta: "Fecha de expedicion de la factura"
      tipo_dato: date
      requerido: true
    - nombre: base_imponible
      etiqueta: "Base imponible de la operacion"
      tipo_dato: float
      requerido: true
    - nombre: tipo_iva
      etiqueta: "Tipo impositivo del IVA aplicado (porcentaje)"
      tipo_dato: int
      requerido: true
    - nombre: cuota_iva
      etiqueta: "Cuota tributaria que se repercuta"
      tipo_dato: float
      requerido: true
    - nombre: retencion_irpf
      etiqueta: "Retencion del IRPF (si aplica a profesionales)"
      tipo_dato: float
      requerido: false
    - nombre: importe_total
      etiqueta: "Importe total a pagar"
      tipo_dato: float
      requerido: true
    - nombre: fecha_procesamiento
      etiqueta: "Fecha de procesamiento"
      tipo_dato: date
      requerido: true
    - nombre: duplicado
      etiqueta: "Indica si el documento ya existe en el sistema"
      tipo_dato: boolean
      requerido: false
    - nombre: base_imponible
      etiqueta: "Base imponible"
      tipo_dato: float
      requerido: true
    - nombre: fecha_documento
      etiqueta: "Fecha del documento"
      tipo_dato: date
      requerido: true

reglas_decision:
  - descripcion: "Validacion matematica del IVA español"
    expresion: "abs(cuota_iva - (base_imponible * (tipo_iva / 100))) <= 0.05"
  - descripcion: "Consistencia del Importe Total Facturado"
    expresion: "abs(importe_total - (base_imponible + cuota_iva - coalesce(retencion_irpf, 0))) <= 0.05"
  - descripcion: "Deteccion de tipos de IVA legales en España"
    expresion: "tipo_iva in [21, 10, 4, 0]"
  - descripcion: "Si tipo_iva es 0, la cuota_iva debe ser 0"
    expresion: "not(tipo_iva == 0 and cuota_iva > 0.01)"
  - descripcion: "Base imponible debe ser mayor que cero"
    expresion: "base_imponible > 0"
  - descripcion: "Detección de redondeos no habituales"
    expresion: "abs((base_imponible * (tipo_iva / 100)) - cuota_iva) <= 1"
  - descripcion: "Validación de retención IRPF si aplica"
    expresion: "retencion_irpf is null or retencion_irpf <= base_imponible * 0.15"
  - descripcion: "Cuota IVA fuera de rango esperado"
    expresion: "cuota_iva >= 0 and cuota_iva <= base_imponible * 0.30"
  - descripcion: "Importe total no puede ser negativo"
    expresion: "importe_total >= 0"
  - descripcion: "Detección de inversión de signos"
    expresion: "not(base_imponible < 0 or cuota_iva < 0 or importe_total < 0)"
  - descripcion: "Fecha del documento debe ser válida y no futura"
    expresion: "fecha_documento <= fecha_procesamiento"
  - descripcion: "Numeración de factura válida"
    expresion: "numero_factura is not null"



