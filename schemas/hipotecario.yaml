name: hipotecario
version: "0.1.0"
domain: hipotecario
document_types:
  - escritura_hipoteca
  - nota_simple
fields:
  - name: titular_nombre
    type: string
    required: true
    description: Nombre completo del titular principal.
    examples:
      - "Juan Pérez García"
  - name: titular_identificacion
    type: string
    required: true
    description: Documento de identificación (DNI/NIE/Pasaporte) según corresponda.
  - name: entidad_financiera
    type: string
    required: true
    description: Nombre de la entidad prestamista.
  - name: importe_prestamo
    type: number
    required: true
    description: Importe del préstamo hipotecario.
    rules:
      - kind: min
        params:
          value: 0
  - name: fecha_firma
    type: date
    required: true
    description: Fecha de firma del documento.
