caso_uso: auditoria_fiscal
version: "1.0"
descripcion: >
  Esquema para verificación documental de facturas de proveedor (AEAT). Incluye validaciones
  básicas y reglas de coherencia matemática del IVA.

documentos:
  - tipo: FACTURA_PROVEEDOR
    descripcion: "Factura de proveedor"
    campos:
      - nombre: razon_social_emisor
        etiqueta: "Denominación social del emisor"
        tipo_dato: string
        requerido: true
      - nombre: nif_emisor
        etiqueta: "Número de Identificación Fiscal (NIF)"
        tipo_dato: string
        requerido: true
        patron: "^[A-HJNP-SUW][0-9]{7}[0-9A-J]$"
      - nombre: num_factura
        etiqueta: "Número de factura y, en su caso, serie"
        tipo_dato: string
        requerido: true
      - nombre: fecha_expedicion
        etiqueta: "Fecha de expedición de la factura"
        tipo_dato: date
        requerido: true
      - nombre: base_imponible
        etiqueta: "Base imponible de la operación"
        tipo_dato: float
        requerido: true
        validacion:
          rango_min: 0.0
      - nombre: tipo_iva
        etiqueta: "Tipo impositivo del IVA aplicado (porcentaje)"
        tipo_dato: int
        requerido: true
        validacion:
          valores_permitidos: [0, 4, 10, 21]
      - nombre: cuota_iva
        etiqueta: "Cuota tributaria repercutida"
        tipo_dato: float
        requerido: true
      - nombre: retencion_irpf
        etiqueta: "Retención IRPF (si aplica)"
        tipo_dato: float
        requerido: false
      - nombre: importe_total
        etiqueta: "Importe total a pagar"
        tipo_dato: float
        requerido: true
        validacion:
          rango_min: 0.0

reglas_decision:
  - id: RF01
    descripcion: "Validación matemática del IVA"
    expresion: "abs(cuota_iva - (base_imponible * (tipo_iva / 100))) <= 0.05"
    severidad: advertencia
    normativa: "Real Decreto 1619/2012 (obligaciones de facturación) — coherencia de IVA"
  - id: RF02
    descripcion: "Consistencia del importe total facturado"
    expresion: "abs(importe_total - (base_imponible + cuota_iva - coalesce(retencion_irpf, 0))) <= 0.05"
    severidad: advertencia
    normativa: "Real Decreto 1619/2012 (obligaciones de facturación) — consistencia de totales"
  - id: RF03
    descripcion: "Tipos de IVA legales"
    expresion: "tipo_iva in [21, 10, 4, 0]"
    severidad: critica
    normativa: "Ley 37/1992 del IVA (tipos impositivos)"

informe:
  formato: ["json", "markdown"]
  incluir_score_confianza: true
  nivel_detalle: resumen
  idioma: es
