caso_uso: kyc_onboarding
version: "1.0"
descripcion: >
  Ley 10/2010 de Prevención del Blanqueo de Capitales y de la Financiación del Terrorismo (España) y SEPBLAC.
documentos:
  tipo: EXPEDIENTE_IDENTIDAD
  campos:
    - nombre: nombre_titular
      etiqueta: "Nombre del ciudadano"
      tipo_dato: string
      requerido: true
    - nombre: primer_apellido
      etiqueta: "Primer apellido del titular"
      tipo_dato: string
      requerido: true
    - nombre: segundo_apellido
      etiqueta: "Segundo apellido del titular"
      tipo_dato: string
      requerido: true
    - nombre: num_documento
      etiqueta: "Numero de DNI o NIE"
      tipo_dato: string
      patron: "^[XYZ0-9][0-9]{7}[A-Z]$" # Valida DNI de 8 d�gitos + letra o NIE con X,Y,Z inicial
      requerido: true
    - nombre: fecha_nacimiento
      etiqueta: "Fecha de nacimiento del titular"
      tipo_dato: date
      requerido: true
    - nombre: fecha_caducidad
      etiqueta: "Fecha de caducidad del documento"
      tipo_dato: date
      requerido: true
    - nombre: domicilio_comprobante
      etiqueta: "Direccion postal que aparece en el recibo de suministro"
      tipo_dato: string
      requerido: true
    - nombre: fecha_documento
      etiqueta: "Fecha del documento"
      tipo_dato: date
      requerido: true
    - nombre: ingresos_mensuales
      tipo_dato: float
      requerido: false
    - nombre: ingresos_anuales
      tipo_dato: float
      requerido: false
    - nombre: suma_ingresos_extractos
      tipo_dato: float
      requerido: false
    - nombre: origen_fondos
      tipo_dato: string
      requerido: false
    - nombre: actividad
      tipo_dato: string
      requerido: false

reglas_decision:
  - descripcion: "Cumplimiento del umbral de mayoria de edad en España"
    expresion: "(fecha_actual - fecha_nacimiento).days / 365.25 >= 18"
  - descripcion: "Verificacion de vigencia del documento de identidad"
    expresion: "fecha_caducidad > fecha_actual"
  - descripcion: "Control AML basico contra fraude por suplantacion"
    expresion: "num_documento != 'No encontrado'"
  - descripcion: "Fecha del documento no puede ser futura"
    expresion: "fecha_documento <= fecha_procesamiento"
  - descripcion: "Operación superior al 30% de los ingresos mensuales"
    expresion: "ingresos_mensuales is null or importe_total <= ingresos_mensuales * 0.30"
  - descripcion: "Ingresos no coherentes con actividad declarada"
    expresion: "not(actividad == 'sin_actividad' and base_imponible > 0)"
  - descripcion: "Origen de fondos debe estar declarado"
    expresion: "origen_fondos is not null"
  - descripcion: "Ingresos anuales coherentes con extractos"
    expresion: "ingresos_anuales is null or ingresos_anuales >= suma_ingresos_extractos * 0.8"
